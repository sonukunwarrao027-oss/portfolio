<!DOCTYPE html>

<html>

<body>

<h1>Student List</h1>

<table border ="1">

<tr>

    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
</tr>

{% for student in students %}

<tr>

    <td>{{ student["id"] }}</td>
    <td>{{ student["name"] }}</td>
    <td>{{ student["age"] }}</td>

</tr>

{% endfor %}

</table>
</body>
</html>
